<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Server Monitor | DevOps Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #06b6d4;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px;
        }

        .header {
            margin-bottom: 40px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value {
            font-size: 32px;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-healthy {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .status-warning {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .progress-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent);
            transition: width 0.5s ease;
        }

        #alerts {
            margin-top: 40px;
            padding: 20px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>☁️ Server Monitoring Dashboard</h1>
        <p>Real-time metrics for Cloud Instance (DevOps style)</p>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3>System Status</h3>
            <div id="status-badge" class="status-badge status-healthy">Loading...</div>
            <div id="uptime" style="margin-top: 15px; font-size: 14px; color: #94a3b8;">Uptime: 00:00:00</div>
        </div>

        <div class="card">
            <h3>CPU Usage</h3>
            <div class="value"><span id="cpu-val">0</span>%</div>
            <div class="progress-bg">
                <div id="cpu-bar" class="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <div class="card">
            <h3>RAM Usage</h3>
            <div class="value"><span id="ram-val">0</span>%</div>
            <div style="font-size: 14px; color: #94a3b8;"><span id="ram-used">0</span> / <span id="ram-total">0</span>
                GB</div>
            <div class="progress-bg">
                <div id="ram-bar" class="progress-bar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div id="alerts">
        <h3 style="color: var(--danger); margin: 0 0 10px 0;">🔴 Active Alerts</h3>
        <div id="alerts-content"></div>
    </div>

    <script>
        function updateStats() {
            fetch('/api/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('cpu-val').innerText = data.cpu;
                    document.getElementById('cpu-bar').style.width = data.cpu + '%';

                    document.getElementById('ram-val').innerText = data.ram;
                    document.getElementById('ram-bar').style.width = data.ram + '%';
                    document.getElementById('ram-used').innerText = data.ram_used;
                    document.getElementById('ram-total').innerText = data.ram_total;

                    document.getElementById('uptime').innerText = 'Uptime: ' + data.uptime;

                    const badge = document.getElementById('status-badge');
                    badge.innerText = data.status;
                    badge.className = 'status-badge ' + (data.status === 'Healthy' ? 'status-healthy' : 'status-warning');

                    const alertsDiv = document.getElementById('alerts');
                    if (data.alerts.length > 0) {
                        alertsDiv.style.display = 'block';
                        document.getElementById('alerts-content').innerHTML = data.alerts.join('<br>');
                    } else {
                        alertsDiv.style.display = 'none';
                    }
                })
                .catch(err => console.error('Fetch error:', err));
        }

        setInterval(updateStats, 2000);
        updateStats();
    </script>
</body>

</html>
